spring:
  application:
    name: sb-concepts-lab

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    sb.concepts.lab: INFO
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [${spring.application.name:application}] [traceId=%X{traceId:-} requestId=%X{requestId:-}] %logger{36} - %msg%n%ex"

app:
  profile-name: default
  description: Base configuration shared by every runtime profile.
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
      - X-Request-Id
      - X-Correlation-Id
    exposed-headers:
      - X-Request-Id
      - X-Correlation-Id
    allow-credentials: false
    max-age: 3600
