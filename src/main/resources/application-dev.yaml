spring:
  config:
    activate:
      on-profile: dev

server:
  port: 8081

logging:
  structured:
    format:
      console: logstash
  level:
    root: INFO
    sb.concepts.lab: INFO

app:
  profile-name: dev
  description: Shared development profile for early integration checks.
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
      - https://dev.example.com
