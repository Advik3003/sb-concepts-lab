spring:
  config:
    activate:
      on-profile: qa

server:
  port: 8082

logging:
  structured:
    format:
      console: logstash
  level:
    root: INFO
    sb.concepts.lab: INFO

app:
  profile-name: qa
  description: QA profile for test verification before production-like runs.
  cors:
    allowed-origins:
      - https://qa.example.com
